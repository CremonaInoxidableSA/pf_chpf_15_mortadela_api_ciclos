networks:
  macvlan_network:
    driver: macvlan
    driver_opts:
      parent: eno1
    ipam:
      config:
        - subnet: 192.168.10.0/24
          gateway: 192.168.10.240

services:
  fastapi_app:
    build: .
    container_name: fastapi_container
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@192.168.10.5:3306/${MYSQL_DATABASE}
    ports:
      - "8020:8020"
    volumes:
      - .:/app
    command: >
      uvicorn main:app --host 0.0.0.0 --port 8020 --reload
    networks:
      macvlan_network:
        ipv4_address: 192.168.10.5